<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Questions and Solutions</title>


    <!-- Bootstrap 3 -->

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">


    <style>

        .theme-toggle {
            margin-top: 10px;
        }

        .print-button {
            margin-top: 10px;
        }


        /* Light Theme */

        .light-theme {
            background-color: #ffffff;
            color: #000;
        }

        .light-theme .rightAns {
            color: green;
        }

        .light-theme .qpnltbl td,
        .light-theme .qrtbl td,
        .light-theme .menu-tbl td {
            border: 1px solid #ccc;
        }

        .light-theme .option img {
            filter: invert(0);
        }


        /* Dark Theme */

        .dark-theme {
            background-color: #41403e;
            color: #fff;
        }

        .dark-theme .rightAns {
            color: rgb(8, 202, 8);
        }

        .dark-theme .qpnltbl td,
        .dark-theme .qrtbl td,
        .dark-theme .menu-tbl td {
            border: 1px solid #ccc;
        }


        /* Tables */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }


        /* Question */

        .correct {
            background-color: #d4edda;
        }

        .incorrect {
            background-color: #f8d7da;
        }

        .grp-cntr {
            background-color: #696866;
            margin: 10px;
            padding: 10px 10px 4px;
            box-sizing: border-box;
        }

        .question-pnl {
            page-break-inside: avoid;
        }


        .qpnltbl,
        .qrtbl,
        .menu-tbl {
            width: 100%;
            border-collapse: collapse;
        }


        .qpnltbl td,
        .qrtbl td,
        .menu-tbl td {
            padding: 8px;
            border: 1px solid #ccc;
        }


        .bold {
            font-weight: bold;
        }

        .rightAns {
            color: rgb(8, 202, 8);
        }

        .wrngAns {
            color: red;
        }


        /* Option */

        .cross {
            width: 22px;
        }

        .img-thumbnail {
            margin-top: 10px;
            max-width: 320px;
            border: none !important;
        }


        .option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .option img {
            margin-left: 10px;
        }


        /* Preloader */

        #preLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Watermark */

        .watermark-container {
            position: relative;
        }


        .watermark-layer {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            font-size: 24px;
            font-weight: 700;
            transform: rotate(-45deg);
            opacity: 0.12;
            white-space: nowrap;
        }


        body.dark-theme .watermark-layer {
            color: rgba(255, 255, 255, 0.445);
        }


        body.light-theme .watermark-layer {
            color: rgba(0, 0, 0, 0.678);
        }


        /* Print */

        @media print {

            .hidden-print {
                display: none !important;
            }


            .watermark-layer {
                opacity: 0.15 !important;
                position: fixed;
            }

        }

    </style>


    <script>

        window.onload = function () {

            const loader =
                document.getElementById(
                    'preLoader'
                );

            if (!loader) {
                return;
            }

            loader.style.transition =
                "all 2s ease-in-out";

            loader.style.opacity =
                "0";

            loader.style.visibility =
                "hidden";

        };

    </script>

</head>


<body>


    <!-- ============================================================
         PRELOADER
         ============================================================ -->

    <div id="preLoader">

        <div class="spinner-grow spinner-grow-sm text-primary mx-1"
             role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>

    </div>


    <!-- ============================================================
         BUTTONS
         ============================================================ -->

    <div class="container hidden-print">

        <button class="btn btn-default btn-sm theme-toggle"
                id="toggleTheme">

            <i class="glyphicon glyphicon-adjust"></i>
            Change Theme

        </button>


        <button class="btn btn-warning btn-sm print-button"
                onclick="generatePDF();">

            <span class="glyphicon glyphicon-print"></span>
            Print

        </button>


        <button class="btn btn-success btn-sm print-button"
                onclick="downloadPDF();">

            <span class="glyphicon glyphicon-download"></span>
            Download PDF

        </button>


        <button class="btn btn-primary btn-sm print-button"
                onclick="reAttempt();">

            Reattempt Test

        </button>

    </div>


    <!-- ============================================================
         CONTENT
         ============================================================ -->

    <div class="container watermark-container">


        <h3 class="text-center"
            id="title"
            style="margin-bottom:30px;">

            Questions and Solutions

        </h3>


        <div id="content">

            <div id="question-container">

                <!-- Dynamic questions -->

            </div>

        </div>


        <div id="ErrorMsg"></div>

    </div>


    <!-- MathJax -->

    <script id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3.0.0/es5/tex-mml-chtml.js">
    </script>


    <!-- jQuery -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js">
    </script>


    <!-- Bootstrap -->

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js">
    </script>


    <script>

        /*
         * ============================================================
         * THEME
         * ============================================================
         */

        let currentTheme = 'dark';

        document.body.classList.add(
            'dark-theme'
        );


        /*
         * ============================================================
         * WATERMARK
         * ============================================================
         */

        function generateWatermarks(id) {

            $('.watermark-layer').remove();


            const container =
                document.querySelector(
                    '.watermark-container'
                );


            if (!container) {
                return;
            }


            const docHeight =
                Math.max(
                    document.body.scrollHeight,
                    document.documentElement.scrollHeight
                );


            const rows =
                Math.ceil(
                    docHeight / 220
                ) + 4;


            const cols = 5;


            for (
                let i = 0;
                i < rows;
                i++
            ) {

                for (
                    let j = 0;
                    j < cols;
                    j++
                ) {

                    const div =
                        document.createElement(
                            'div'
                        );


                    div.className =
                        'watermark-layer';


                    div.innerText =
                        id;


                    div.style.top =
                        `${i * 220}px`;


                    div.style.left =
                        `${j * 340 - 60}px`;


                    container.appendChild(
                        div
                    );

                }

            }

        }


        /*
         * ============================================================
         * NORMALIZE BOTH JSON FORMATS
         * ============================================================
         */

        function normalizeExamData(data) {


            /*
             * --------------------------------------------------------
             * FORMAT 1 
             *
             * data.section[]
             * section.name
             * section.mock_questions.english[]
             * --------------------------------------------------------
             */

            if (Array.isArray(data.section)) {

                return data.section.map(
                    function (section) {

                        return {

                            name:
                                section.name || '',

                            questions:
                                section.mock_questions &&
                                Array.isArray(
                                    section.mock_questions.english
                                )
                                    ? section.mock_questions.english
                                    : []

                        };

                    }
                );

            }


            /*
             * --------------------------------------------------------
             * FORMAT 2 
             *
             * data.sections[]
             * section.section_name
             * section.questions.english[]
             * --------------------------------------------------------
             */

            if (Array.isArray(data.sections)) {

                return data.sections.map(
                    function (section) {

                        return {

                            name:
                                section.section_name || '',

                            questions:
                                section.questions &&
                                Array.isArray(
                                    section.questions.english
                                )
                                    ? section.questions.english
                                    : []

                        };

                    }
                );

            }


            /*
             * Unknown format
             */

            return null;

        }


        /*
         * ============================================================
         * CLEAN OPTION
         * ============================================================
         */

        function cleanOptionHTML(html) {

            if (!html) {
                return '';
            }

            return String(html)
                .replace(/^<p>/, '')
                .replace(/<\/p>$/, '');

        }


        /*
         * ============================================================
         * LOAD BANKING DATA
         * ============================================================
         */

        $.getJSON(
            "banking-data.json",
            function (data) {


                /*
                 * Your banking-data.json is an array,
                 * so don't use Object.values() here.
                 */

                const exam_data =
                    Array.isArray(data)
                        ? data
                        : Object.values(data);


                /*
                 * Exam ID
                 */

                const url =
                    new URL(
                        window.location.href
                    );


                const examID =
                    url.searchParams.get(
                        "ExamID"
                    );


                /*
                 * Validate Exam ID
                 */

                if (
                    !examID ||
                    examID.length !== 10 ||
                    isNaN(examID)
                ) {

                    showErrorPage();

                    return;

                }


                /*
                 * Find exam
                 */

                const exam_info =
                    exam_data.find(
                        function (x) {

                            return x.exam_id === examID;

                        }
                    );


                if (!exam_info) {

                    showErrorPage();

                    return;

                }


                /*
                 * Exam metadata
                 */

                const exam_name =
                    exam_info.exam_name;


                const exam_db =
                    exam_info.exam_db;


                $("#title").text(
                    exam_name
                );


                document.title =
                    exam_name;


                /*
                 * Initial watermark
                 */

                generateWatermarks(
                    examID
                );


                /*
                 * ========================================================
                 * LOAD QUESTION JSON
                 * ========================================================
                 */

                $.getJSON(
                    exam_db,
                    function (data) {


                        const container =
                            $("#question-container");


                        let globalQNum = 1;


                        /*
                         * Normalize
                         */

                        const normalizedSections =
                            normalizeExamData(
                                data
                            );


                        /*
                         * Invalid format
                         */

                        if (!normalizedSections) {

                            showErrorPage();

                            return;

                        }


                        /*
                         * =================================================
                         * LOOP THROUGH SECTIONS
                         * =================================================
                         */

                        $.each(
                            normalizedSections,
                            function (
                                secIndex,
                                section
                            ) {


                                /*
                                 * Skip empty sections
                                 */

                                if (
                                    !section.questions ||
                                    !section.questions.length
                                ) {

                                    return;

                                }


                                /*
                                 * Section title
                                 */

                                container.append(`

                                    <h4
                                        style="
                                            margin-top:20px;
                                            font-weight:bold;
                                            border-bottom:2px solid #ccc;
                                            padding-bottom:5px;
                                        "
                                    >
                                        ${section.name}
                                    </h4>

                                `);


                                /*
                                 * =================================================
                                 * QUESTIONS
                                 * =================================================
                                 */

                                $.each(
                                    section.questions,
                                    function (
                                        qIndex,
                                        item
                                    ) {


                                        /*
                                         * Answer
                                         */

                                        const correctOption =
                                            parseInt(
                                                item.answer,
                                                10
                                            );


                                        let optionsHtml =
                                            '';


                                        /*
                                         * =================================================
                                         * OPTIONS
                                         * =================================================
                                         */

                                        if (
                                            Array.isArray(
                                                item.options
                                            )
                                        ) {

                                            $.each(
                                                item.options,
                                                function (
                                                    optIndex,
                                                    optHTML
                                                ) {


                                                    const isCorrect =
                                                        correctOption ===
                                                        optIndex;


                                                    const cleanOpt =
                                                        cleanOptionHTML(
                                                            optHTML
                                                        );


                                                    const iconSrc =
                                                        isCorrect
                                                            ? '../../assets/img/tick.png'
                                                            : '../../assets/img/cross.png';


                                                    optionsHtml += `

                                                        <div
                                                            class="option"
                                                        >

                                                            <div
                                                                style="
                                                                    margin-right:10px;
                                                                    display:flex;
                                                                    align-items:center;
                                                                "
                                                                class="${
                                                                    isCorrect
                                                                        ? 'rightAns'
                                                                        : 'wrngAns'
                                                                }"
                                                            >

                                                                <p>

                                                                    <span
                                                                        style="
                                                                            margin-right:3px;
                                                                        "
                                                                    >
                                                                        ${
                                                                            String.fromCharCode(
                                                                                65 +
                                                                                optIndex
                                                                            )
                                                                        })
                                                                    </span>

                                                                    ${cleanOpt}

                                                                </p>

                                                            </div>


                                                            <img
                                                                src="${iconSrc}"
                                                            >

                                                        </div>

                                                    `;

                                                }
                                            );

                                        }


                                        /*
                                         * =================================================
                                         * QUESTION PANEL
                                         * =================================================
                                         */

                                        const questionPanel = `

                                            <table
                                                class="qpnltbl"
                                            >

                                                <tbody>

                                                    <tr>

                                                        <td
                                                            class="rw"
                                                        >

                                                            <table
                                                                class="qrtbl"
                                                            >

                                                                <tbody>

                                                                    <tr>

                                                                        <td
                                                                            width="7%"
                                                                            class="bold"
                                                                            valign="top"
                                                                        >
                                                                            Q.
                                                                            ${globalQNum++}
                                                                        </td>


                                                                        <td
                                                                            class="bold"
                                                                            valign="top"
                                                                            style="
                                                                                text-align:left;
                                                                                position:relative;
                                                                            "
                                                                        >


                                                                            <!--
                                                                                Question ID
                                                                            -->

                                                                            <div
                                                                                style="
                                                                                    position:absolute;
                                                                                    top:4px;
                                                                                    right:6px;
                                                                                    font-size:9px;
                                                                                    font-weight:700;
                                                                                    opacity:0.18;
                                                                                    color:inherit;
                                                                                    letter-spacing:0.08em;
                                                                                    pointer-events:none;
                                                                                    user-select:none;
                                                                                    transform:rotate(-8deg);
                                                                                "
                                                                            >
                                                                                ${examID}
                                                                            </div>


                                                                            <!--
                                                                                Common data
                                                                            -->

                                                                            <div
                                                                                style="
                                                                                    margin-bottom:10px;
                                                                                    font-weight:normal;
                                                                                "
                                                                            >
                                                                                ${
                                                                                    item.common_data ||
                                                                                    ''
                                                                                }
                                                                            </div>


                                                                            <!--
                                                                                Question
                                                                            -->

                                                                            ${
                                                                                item.question ||
                                                                                ''
                                                                            }


                                                                            <!--
                                                                                Options
                                                                            -->

                                                                            ${optionsHtml}

                                                                        </td>

                                                                    </tr>


                                                                    <!--
                                                                        Explanation
                                                                    -->

                                                                    <tr>

                                                                        <td>
                                                                            <b>
                                                                                Explanation:
                                                                            </b>
                                                                        </td>


                                                                        <td
                                                                            style="
                                                                                padding-left:20px;
                                                                            "
                                                                        >

                                                                            <div
                                                                                class="solution"
                                                                            >
                                                                                ${
                                                                                    item.explanation ||
                                                                                    ''
                                                                                }
                                                                            </div>

                                                                        </td>

                                                                    </tr>

                                                                </tbody>

                                                            </table>

                                                        </td>

                                                    </tr>

                                                </tbody>

                                            </table>

                                        `;


                                        container.append(
                                            questionPanel
                                        );

                                    }
                                );

                            }
                        );


                        /*
                         * Style images inside explanations
                         */

                        $('.solution img')
                            .addClass(
                                'img-thumbnail'
                            );


                        /*
                         * MathJax typesetting
                         */

                        if (
                            window.MathJax &&
                            window.MathJax.typesetPromise
                        ) {

                            window.MathJax
                                .typesetPromise();

                        }


                        /*
                         * Regenerate watermark
                         */

                        setTimeout(
                            function () {

                                generateWatermarks(
                                    examID
                                );

                            },
                            500
                        );

                    }
                ).fail(
                    function () {

                        $("#title, #content")
                            .hide();


                        $("#ErrorMsg").html(`

                            <center>

                                <h1>
                                    Error: Could not load DB file
                                </h1>

                                <p>
                                    ${exam_db}
                                </p>

                            </center>

                        `);

                    }
                );


            }
        ).fail(
            function () {

                showErrorPage();

            }
        );


        /*
         * ============================================================
         * THEME TOGGLE
         * ============================================================
         */

        document
            .getElementById(
                'toggleTheme'
            )
            .addEventListener(
                'click',
                function () {

                    if (
                        currentTheme ===
                        'dark'
                    ) {

                        $('body')
                            .removeClass(
                                'dark-theme'
                            )
                            .addClass(
                                'light-theme'
                            );


                        currentTheme =
                            'light';

                    } else {

                        $('body')
                            .removeClass(
                                'light-theme'
                            )
                            .addClass(
                                'dark-theme'
                            );


                        currentTheme =
                            'dark';

                    }

                }
            );


        /*
         * ============================================================
         * ERROR PAGE
         * ============================================================
         */

        function showErrorPage() {

            $("#title, #content")
                .hide();


            $("#ErrorMsg").html(`

                <center>

                    <h1>
                        Error 404: Page Not Found
                    </h1>


                    <p>

                        You have entered a wrong URL
                        or the page is unavailable.

                        <br>
                        <br>

                        Contact the administrator at

                        <a href="mailto:nandysagar@yahoo.com">
                            nandysagar@yahoo.com
                        </a>

                        <br>
                        <br>

                        <a href="https://nandysagar.in">
                            Go to NANDYSAGAR.IN
                        </a>

                    </p>

                </center>

            `);

        }

    </script>


    <!-- ============================================================
         FUNCTIONAL SCRIPTS
         ============================================================ -->

    <script>


        /*
         * ============================================================
         * PRINT
         * ============================================================
         */

        function generatePDF() {

            const originalTitle =
                document.title;


            const newTitle =
                originalTitle
                    .replace(/,/g, '-')
                    .replace(/\s+/g, '-');


            document.title =
                newTitle;


            setTimeout(
                function () {

                    window.print();


                    document.title =
                        originalTitle;

                },
                100
            );

        }


        /*
         * ============================================================
         * DOWNLOAD PDF
         * ============================================================
         */

        function downloadPDF() {

            const originalTitle =
                document.title;


            const newTitle =
                originalTitle
                    .replace(/,/g, '-')
                    .replace(/\s+/g, '-');


            const pdfUrl =
                `pdf/${newTitle}.pdf`;


            window.open(
                pdfUrl,
                '_blank'
            );

        }


        /*
         * ============================================================
         * REATTEMPT
         * ============================================================
         */

        function reAttempt() {

            const url =
                new URL(
                    window.location.href
                );


            const examID =
                url.searchParams.get(
                    "ExamID"
                );


            const assessmentUrl =
                `../../OnlineAssessment/index.html?ExamId=${examID}`;


            window.open(
                assessmentUrl,
                '_blank'
            );

        }

    </script>


</body>

</html>
